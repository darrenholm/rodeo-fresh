<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Holmdale Pro Rodeo — Ticket Sales Facebook Post</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #111; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 600px at 50% 38%, rgba(0,183,74,0.28) 0%, rgba(0,183,74,0.10) 45%, rgba(0,0,0,0) 72%),
      linear-gradient(180deg, #232320 0%, #1b1b19 55%, #141412 100%);
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    color: #e8e4d8;
  }

  /* starburst rays behind the big stat */
  .rays {
    position: absolute;
    left: 50%; top: 410px;
    width: 1600px; height: 1600px;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(
      from 0deg,
      rgba(232,228,216,0.05) 0deg 6deg,
      rgba(232,228,216,0.00) 6deg 15deg
    );
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 35%, rgba(0,0,0,0) 62%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 35%, rgba(0,0,0,0) 62%);
  }

  /* rope-style double border */
  .frame {
    position: absolute;
    inset: 26px;
    border: 3px solid rgba(232,228,216,0.85);
    outline: 2px dashed rgba(232,228,216,0.45);
    outline-offset: -12px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    font-size: 30px;
    color: #00B74A;
    line-height: 1;
  }
  .corner.tl { top: 42px; left: 46px; }
  .corner.tr { top: 42px; right: 46px; }
  .corner.bl { bottom: 42px; left: 46px; }
  .corner.br { bottom: 42px; right: 46px; }

  .inner {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 90px 48px;
    text-align: center;
  }

  .logo {
    height: 178px;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,0.55));
  }

  .kicker {
    margin-top: 18px;
    font-weight: 700;
    font-size: 43px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e8e4d8;
  }
  .kicker .star { color: #00B74A; letter-spacing: 0; }

  .statline {
    margin-top: 12px;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(232,228,216,0.92);
  }

  .bigstat {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    line-height: 0.9;
    margin-top: 4px;
  }
  .bigstat .num {
    font-family: 'Alfa Slab One', 'Georgia', serif;
    font-size: 218px;
    color: #00C851;
    text-shadow:
      0 4px 0 #007a31,
      0 8px 0 #005e26,
      0 16px 36px rgba(0,0,0,0.6);
  }
  .bigstat .x {
    font-family: 'Alfa Slab One', 'Georgia', serif;
    font-size: 122px;
    color: #e8e4d8;
    text-shadow: 0 6px 0 #8d8875, 0 14px 30px rgba(0,0,0,0.6);
  }

  .statsub {
    margin-top: 16px;
    font-weight: 700;
    font-size: 49px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #e8e4d8;
  }
  .statsub em {
    font-style: normal;
    color: #00C851;
  }

  .cap {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    border: 3px solid rgba(232,228,216,0.8);
    padding: 14px 36px;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e8e4d8;
    background: rgba(0,0,0,0.28);
  }
  .cap .star { color: #00B74A; font-size: 30px; }

  .capsub {
    margin-top: 12px;
    font-weight: 500;
    font-size: 33px;
    letter-spacing: 2px;
    color: rgba(232,228,216,0.75);
  }

  .cta {
    margin-top: 24px;
    background: linear-gradient(180deg, #00C851 0%, #00A542 100%);
    color: #12130f;
    font-weight: 700;
    font-size: 50px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 18px 58px;
    border-radius: 14px;
    box-shadow: 0 8px 0 #006127, 0 18px 40px rgba(0,0,0,0.55);
  }

  .site {
    margin-top: 16px;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 7px;
    color: rgba(232,228,216,0.85);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="rays"></div>
    <div class="frame"></div>
    <div class="corner tl">&#10022;</div>
    <div class="corner tr">&#10022;</div>
    <div class="corner bl">&#10022;</div>
    <div class="corner br">&#10022;</div>

    <div class="inner">
      <img class="logo" src="../../assets/rodeo-logo.png" alt="Holmdale Pro Rodeo">

      <div class="kicker"><span class="star">&#9733;</span>&nbsp; Don't be disappointed, folks! &nbsp;<span class="star">&#9733;</span></div>

      <div class="statline">Ticket sales are over</div>
      <div class="bigstat">
        <span class="num">4</span><span class="x">&times;</span>
      </div>
      <div class="statsub">higher than <em>this time last year</em></div>

      <div class="cap"><span class="star">&#9733;</span> Limited to 3,000 guests per day <span class="star">&#9733;</span></div>
      <div class="capsub">No overcrowding &mdash; just a fantastic time for everyone</div>

      <div class="cta">Get Your Tickets Today</div>
      <div class="site">HOLMDALERODEO.CA</div>
    </div>
  </div>
</body>
</html>
