<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Resend - Holmdale Pro Rodeo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00B74A 0%, #2A2A2A 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header h1 { color: #00B74A; font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .header h2 { color: #3A3A3A; font-size: 20px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-input {
            flex: 1;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
        }
        .search-input:focus { border-color: #00B74A; }
        .search-btn {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #00B74A;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .search-btn:hover { background: #009a3e; }
        .search-btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .ticket-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .ticket-name { font-size: 18px; font-weight: bold; color: #1a202c; }
        .ticket-email { font-size: 14px; color: #718096; margin-top: 2px; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-confirmed { background: #c6f6d5; color: #22543d; }
        .badge-pending { background: #fefcbf; color: #744210; }
        .badge-cancelled { background: #fed7d7; color: #742a2a; }
        .badge-refunded { background: #e9d8fd; color: #553c9a; }
        .ticket-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .detail-label { color: #718096; }
        .detail-value { color: #1a202c; font-weight: 600; }
        .resend-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background: #00B74A;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .resend-btn:hover { background: #009a3e; }
        .resend-btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .resend-btn.sent { background: #38a169; }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
            font-size: 16px;
        }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
        }
        .alert-error { background: #fed7d7; color: #742a2a; border-left: 4px solid #f56565; }
        .alert-success { background: #c6f6d5; color: #22543d; border-left: 4px solid #48bb78; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-count {
            font-size: 14px;
            color: #718096;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Staff Portal</a>
        
        <div class="header">
            <h1>HOLMDALE PRO RODEO</h1>
            <h2>📧 Ticket Resend</h2>
            <p>Search for tickets and resend confirmation emails</p>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="search-row">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search by customer name or email..."
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn" onclick="handleSearch()">Search</button>
            </div>

            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
        let token = '';

        window.onload = function() {
            token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('searchInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleSearch();
            });

            document.getElementById('searchInput').focus();
        };

        async function handleSearch() {
            const searchValue = document.getElementById('searchInput').value.trim();
            if (!searchValue) return;

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';

            try {
                const r = await fetch(API + '/ticket-orders/search', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ searchValue: searchValue, searchType: 'name' })
                });

                if (!r.ok) {
                    throw new Error('Search failed: ' + r.status);
                }

                const data = await r.json();
                const tickets = data.results || data || [];
                renderResults(tickets, searchValue);
            } catch (err) {
                console.error('Search error:', err);
                showMessage('Search failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        function renderResults(tickets, searchTerm) {
            const container = document.getElementById('resultsContainer');

            if (!tickets.length) {
                container.innerHTML = '<div class="no-results">No tickets found for "' + searchTerm + '"</div>';
                return;
            }

            let html = '<div class="result-count">Found ' + tickets.length + ' ticket' + (tickets.length !== 1 ? 's' : '') + '</div>';

            tickets.forEach(function(ticket) {
                const statusClass = ticket.status === 'confirmed' ? 'badge-confirmed' : 
                                   ticket.status === 'cancelled' ? 'badge-cancelled' : 
                                   ticket.status === 'refunded' ? 'badge-refunded' : 'badge-pending';

                html += '<div class="ticket-card">' +
                    '<div class="ticket-header">' +
                        '<div>' +
                            '<div class="ticket-name">' + (ticket.customer_name || 'Unknown') + '</div>' +
                            '<div class="ticket-email">' + (ticket.customer_email || 'No email') + '</div>' +
                        '</div>' +
                        '<span class="badge ' + statusClass + '">' + (ticket.status || 'unknown') + '</span>' +
                    '</div>' +
                    '<div class="ticket-details">' +
                        '<div><span class="detail-label">Type: </span><span class="detail-value">' + (ticket.ticket_type || 'mixed') + '</span></div>' +
                        '<div><span class="detail-label">Quantity: </span><span class="detail-value">' + (ticket.quantity_adult || 0) + ' adults, ' + (ticket.quantity_child || 0) + ' children</span></div>' +
                        '<div><span class="detail-label">Confirmation: </span><span class="detail-value" style="font-family:monospace;font-size:12px;">' + (ticket.confirmation_code || '—') + '</span></div>' +
                        '<div><span class="detail-label">Total: </span><span class="detail-value">$' + (parseFloat(ticket.total_price || 0).toFixed(2)) + '</span></div>' +
                    '</div>' +
                    '<button class="resend-btn" id="btn-' + ticket.id + '" onclick="handleResend(\'' + ticket.id + '\', \'' + (ticket.confirmation_code || '') + '\')">' +
                        '📧 Resend Ticket Email' +
                    '</button>' +
                '</div>';
            });

            container.innerHTML = html;
        }

        async function handleResend(ticketId, confirmationCode) {
            var btn = document.getElementById('btn-' + ticketId);
            if (!btn || btn.disabled) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                var r = await fetch(API + '/email/resend-ticket', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ confirmation_code: confirmationCode })
                });

                if (!r.ok) {
                    var errData = await r.json().catch(function() { return {}; });
                    throw new Error(errData.error || 'Failed to resend');
                }

                btn.innerHTML = '✅ Email Sent!';
                btn.classList.add('sent');
                showMessage('Ticket email resent successfully!', 'success');

                setTimeout(function() {
                    btn.disabled = false;
                    btn.classList.remove('sent');
                    btn.innerHTML = '📧 Resend Ticket Email';
                }, 3000);

            } catch (err) {
                console.error('Resend error:', err);
                showMessage('Failed to resend: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '📧 Resend Ticket Email';
            }
        }

        function showMessage(msg, type) {
            var alertDiv = document.getElementById('alertContainer');
            alertDiv.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(function() { alertDiv.innerHTML = ''; }, 5000);
        }
    </script>
</body>
</html>
