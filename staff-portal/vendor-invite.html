<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Invite - Holmdale Pro Rodeo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00B74A 0%, #2A2A2A 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .header h1 { color: #00B74A; font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .header h2 { color: #3A3A3A; font-size: 20px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #00B74A; }
        .form-group textarea { resize: vertical; min-height: 120px; font-family: inherit; }
        .send-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background: #00B74A;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .send-btn:hover { background: #009a3e; }
        .send-btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .send-btn.sent { background: #38a169; }
        .copy-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        .copy-section h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }
        .link-box {
            display: flex;
            gap: 10px;
        }
        .link-input {
            flex: 1;
            padding: 12px 14px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #f7fafc;
            color: #333;
            outline: none;
        }
        .copy-btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #2563eb; }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
        }
        .alert-error { background: #fed7d7; color: #742a2a; border-left: 4px solid #f56565; }
        .alert-success { background: #c6f6d5; color: #22543d; border-left: 4px solid #48bb78; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sent-list {
            margin-top: 20px;
        }
        .sent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .sent-item:last-child { border-bottom: none; }
        .sent-item .email { color: #333; font-weight: 500; }
        .sent-item .time { color: #a0aec0; font-size: 12px; }
        .sent-item .status { color: #38a169; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Staff Portal</a>

        <div class="header">
            <h1>HOLMDALE PRO RODEO</h1>
            <h2>📋 Vendor Invite</h2>
            <p>Send the vendor registration form by email</p>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="form-group">
                <label>Vendor Email Address</label>
                <input type="email" id="vendorEmail" placeholder="vendor@business.com">
            </div>
            <div class="form-group">
                <label>Vendor / Contact Name (optional)</label>
                <input type="text" id="vendorName" placeholder="Business or contact name">
            </div>
            <div class="form-group">
                <label>Personal Message (optional)</label>
                <textarea id="personalMessage" placeholder="Add a personal note to include in the email..."></textarea>
            </div>

            <button class="send-btn" id="sendBtn" onclick="handleSend()">📧 Send Invitation</button>

            <div class="copy-section">
                <h3>Or copy the registration link:</h3>
                <div class="link-box">
                    <input type="text" class="link-input" id="regLink" value="https://staff.holmdalerodeo.ca/vendor-register.html" readonly>
                    <button class="copy-btn" onclick="copyLink()">Copy</button>
                </div>
            </div>

            <div class="sent-list" id="sentList"></div>
        </div>
    </div>

    <script>
        var API = 'https://rodeo-fresh-production-7348.up.railway.app/api';
        var token = '';
        var sentEmails = [];

        window.onload = function() {
            token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('vendorEmail').focus();
            document.getElementById('vendorEmail').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleSend();
            });
        };

        async function handleSend() {
            var email = document.getElementById('vendorEmail').value.trim();
            var name = document.getElementById('vendorName').value.trim();
            var message = document.getElementById('personalMessage').value.trim();

            if (!email || !email.includes('@')) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            var btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                var r = await fetch(API + '/email/vendor-invite', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: email,
                        vendor_name: name,
                        personal_message: message
                    })
                });

                if (!r.ok) {
                    var errData = await r.json().catch(function() { return {}; });
                    throw new Error(errData.error || 'Failed to send');
                }

                btn.innerHTML = '✅ Sent!';
                btn.classList.add('sent');
                showMessage('Invitation sent to ' + email, 'success');

                sentEmails.unshift({ email: email, name: name, time: new Date() });
                renderSentList();

                // Reset form
                setTimeout(function() {
                    document.getElementById('vendorEmail').value = '';
                    document.getElementById('vendorName').value = '';
                    document.getElementById('personalMessage').value = '';
                    btn.disabled = false;
                    btn.classList.remove('sent');
                    btn.innerHTML = '📧 Send Invitation';
                    document.getElementById('vendorEmail').focus();
                }, 2000);

            } catch (err) {
                console.error('Send error:', err);
                showMessage('Failed to send: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '📧 Send Invitation';
            }
        }

        function copyLink() {
            var input = document.getElementById('regLink');
            input.select();
            navigator.clipboard.writeText(input.value).then(function() {
                showMessage('Link copied to clipboard!', 'success');
            });
        }

        function renderSentList() {
            var container = document.getElementById('sentList');
            if (sentEmails.length === 0) { container.innerHTML = ''; return; }

            var html = '<h3 style="font-size:14px;color:#666;margin-bottom:10px;">Sent this session:</h3>';
            sentEmails.forEach(function(item) {
                var timeStr = item.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += '<div class="sent-item">' +
                    '<div><span class="email">' + item.email + '</span>' +
                    (item.name ? ' <span style="color:#a0aec0;">(' + item.name + ')</span>' : '') +
                    '</div>' +
                    '<div><span class="status">✓ Sent</span> <span class="time">' + timeStr + '</span></div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function showMessage(msg, type) {
            var container = document.getElementById('alertContainer');
            container.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>';
            setTimeout(function() { container.innerHTML = ''; }, 4000);
        }
    </script>
</body>
</html>
